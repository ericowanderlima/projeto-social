<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Projeto redes sociais</title>
</head>
<body>
  <main>
    <section id="celular">
      <img src="imagens/frame-iphone.png" alt="iphone">

      <iframe src="home.html" name="iframe" frameborder="1">
        
      </iframe>

    </section>

    <section id="botoes">
      <a href="home.html" target="iframe">
        <img src="imagens/logo-home.jpg" alt="home">
      </a>

      <a class="youtube" href="youtube.html" target="iframe">
        <img src="imagens/logo-youtube.jpg" alt="">
      </a>

      <a href="facebook.html" target="iframe">
        <img src="imagens/logo-facebook.jpg" alt="facebook">
      </a>

      <a href="github.html" target="iframe">
        <img src="imagens/logo-github.jpg" alt="github">
      </a>

      <a href="instagram.html" target="iframe">
        <img src="imagens/logo-instagram.jpg" alt="instagram">
      </a>

      <a href="twitter.html" target="iframe">
        <img src="imagens/logo-twitter.jpg" alt="twitter">
      </a>
    </section>
  </main>

</body>
</html>
